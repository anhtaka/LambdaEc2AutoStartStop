name: Manual Release

on:
  workflow_dispatch:  # 手動実行

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create zip file
        run: |
          ZIP_NAME="release-${{ github.run_number }}.zip"
          zip -rq "$ZIP_NAME" node_modules/ app.js package.json
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "manual-release-${{ github.run_number }}" "$ZIP_NAME" \
            --title "Manual Release ${{ github.run_number }}" \
            --notes "Automated manual release"
